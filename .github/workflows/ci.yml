name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory
          POSTGRES_DB: inventoryflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inventory -d inventoryflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest suite
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://inventory:inventory@localhost:5432/inventoryflow_test
          SECRET_KEY: ci-test-secret-key
        run: pytest app/tests -v

  build-and-push:
    name: Build and push image to ECR
    needs: test
    # Only run on an actual push to main — never for pull requests, so a
    # branch someone else opens can't trigger an image push to your registry.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required so GitHub can request the OIDC token
      contents: read
    env:
      AWS_REGION: us-east-2
      ECR_REPOSITORY: inventoryflow-api

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Assume the IAM role via OIDC (no stored AWS keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::875115942176:role/github-actions-ecr-push-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push the image
        working-directory: backend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:latest \
            -t $REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            .
          docker push $REGISTRY/$ECR_REPOSITORY:latest
          docker push $REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          